plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.81'
}
version = mod_version
group = 'local.lostworld'
base { archivesName = 'world-progression-core' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets {
    test {
        // The saved-town lookup check reads the actual 1.21.1 position and NBT types.
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.compileClasspath
    }
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    version = project.neo_version
    runs {
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'world_progression_core'
            systemProperty 'lostworld.disableAutomaticSettlement', 'true'
            gameDirectory = project.file(project.findProperty('chapterTestDir') ?: 'run-gametest')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file(project.findProperty('chapterServerDir') ?: 'run-server')
            if (project.hasProperty('chapterWorldGenSmoke')) {
                systemProperty 'lostworld.smokeWorldGeneration', 'true'
            }
        }
    }
    mods {
        world_progression_core {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}
dependencies {
    implementation files('../evolvingblade/build/libs/evolvingblade-1.1.0.jar')
    compileOnly files('../rpgleveling/build/libs/rpgleveling-1.0.0.jar')
    compileOnly files('../../staging/mods/create-1.21.1-6.0.10.jar',
            '../../staging/mods/exposure-neoforge-1.21.1-1.9.21.jar',
            '../../staging/mods/irons_spellbooks-1.21.1-3.16.3.jar',
            '../../staging/mods/confluence-otherworld-1.2.4-260226.jar')
    // Create ships Ponder internally; use that exact copy for its public kinetic API.
    compileOnly zipTree('../../staging/mods/create-1.21.1-6.0.10.jar').matching {
        include 'META-INF/jarjar/*Ponder*.jar', 'META-INF/jarjar/*ponder*.jar'
    }
    // The native saved-data classes implement an interface from Confluence's bundled library.
    compileOnly zipTree('../../staging/mods/confluence-otherworld-1.2.4-260226.jar').matching {
        include 'META-INF/jarjar/org.confluence.lib.confluence_magic_lib-*.jar'
    }
    testImplementation 'com.google.code.gson:gson:2.10.1' // Same version as the Minecraft 1.21.1 SDK.
    if (project.hasProperty('chapterIntegrationMods')) {
        localRuntime fileTree('../../work/chapter1/integration-mods') { include '*.jar' }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    filteringCharset = 'UTF-8'
    inputs.property('mod_version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: project.version) }
}
tasks.register('verifyLogic', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'local.lostworld.ChapterLogicCheck'
}
tasks.named('check') { dependsOn tasks.named('verifyLogic') }
tasks.named('jar') { from('LICENSE') }
