plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.81'
}

version = mod_version
group = 'com.infinite.core'
base { archivesName = 'infinitecore' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    mods {
        infinitecore { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    inputs.property('mod_version', project.version)
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: project.version) }
}

// Pure JVM checks only: no Minecraft bootstrap, client, server, or world.
// JavaExec avoids the Windows non-ASCII Gradle test-worker argfile issue.
tasks.register('verifyLogic', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.infinite.core.GenerationMathCheck'
}
tasks.named('check') { dependsOn tasks.named('verifyLogic') }
tasks.named('jar') { from('LICENSE') }
