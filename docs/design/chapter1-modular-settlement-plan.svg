<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
<rect width="900" height="700" fill="#eef1df"/>
<text x="35" y="40" font-size="24" font-family="Microsoft YaHei">分栋聚落 · 各部件独立定高（布局示意，非游戏截图）</text>
