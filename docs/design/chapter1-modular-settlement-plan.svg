<text x="120" y="200" text-anchor="middle" font-size="16" font-family="Microsoft YaHei">村民房屋 · H1</text>
<rect x="522" y="150" width="132" height="120" fill="#c6a575" stroke="#55483c" stroke-width="3"/>
<text x="588" y="210" text-anchor="middle" font-size="16" font-family="Microsoft YaHei">村民房屋 · H2</text>
