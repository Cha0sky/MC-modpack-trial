<text x="35" y="625" font-size="18" font-family="Microsoft YaHei">H0–H5 分别由当地地形决定，连接路以台阶/短桥适应高差。</text>
<text x="35" y="657" font-size="17" font-family="Microsoft YaHei">优先玩家房屋，陡坡采用小屋后备；床、两只空箱、工作台保留。</text></svg>
